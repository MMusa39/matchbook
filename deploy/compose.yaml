# The whole system, one command:
#   docker compose -f deploy/compose.yaml up -d --build
# Gateway REST http://localhost:8080, gRPC localhost:9091; market data ws://localhost:8081/ws/market-data;
# post-trade http://localhost:8082; Grafana http://localhost:3000; Jaeger http://localhost:16686;
# Prometheus http://localhost:9090.
# All credentials below are local placeholders.

name: matchbook

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    MATCHBOOK_SYMBOLS_FILE: /config/symbols.json
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_TRACES_ENABLED: "true"
  volumes:
    - ./config/symbols.json:/config/symbols.json:ro

services:
  engine:
    <<: *java-service
    build: { context: .., dockerfile: deploy/docker/Dockerfile, target: engine }
    image: matchbook/engine:local
    environment:
      <<: *java-env
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx512m
      ENGINE_MAX_ORDERS_PER_SHARD: "200000"
      ENGINE_WAIT_STRATEGY: SLEEPING
      ENGINE_OUTBOUND_WAIT_STRATEGY: BLOCKING
      ENGINE_SNAPSHOT_INTERVAL: PT30S
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_SERVICE_NAME: engine
    ports: ["9190:9090", "9100:9100"]
    volumes:
      - ./config/symbols.json:/config/symbols.json:ro
      - engine-data:/data
    stop_grace_period: 30s
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9100 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 30

  gateway:
    <<: *java-service
    build: { context: .., dockerfile: deploy/docker/Dockerfile, target: gateway }
    image: matchbook/gateway:local
    environment:
      <<: *java-env
      JAVA_TOOL_OPTIONS: -Xmx256m
      ENGINE_TARGET: engine:9090
      REDIS_HOST: redis
      # Generous per-client limits so the Gatling profile measures latency, not the rate limiter.
      RATE_LIMIT_CAPACITY: "2000"
      RATE_LIMIT_REFILL: "1000"
    ports: ["8080:8080", "9091:9091"]
    depends_on:
      engine: { condition: service_healthy }
      redis: { condition: service_healthy }

  marketdata:
    <<: *java-service
    build: { context: .., dockerfile: deploy/docker/Dockerfile, target: marketdata }
    image: matchbook/marketdata:local
    environment:
      <<: *java-env
      JAVA_TOOL_OPTIONS: -Xmx256m
      ENGINE_TARGET: engine:9090
    ports: ["8081:8081"]
    depends_on:
      engine: { condition: service_healthy }

  posttrade:
    <<: *java-service
    build: { context: .., dockerfile: deploy/docker/Dockerfile, target: posttrade }
    image: matchbook/posttrade:local
    environment:
      <<: *java-env
      JAVA_TOOL_OPTIONS: -Xmx256m
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: changeme-local
    ports: ["8082:8082"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: matchbook
      POSTGRES_USER: matchbook
      POSTGRES_PASSWORD: changeme-local
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchbook -d matchbook"]
      interval: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: changeme-local
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    ports: ["16686:16686"]

volumes:
  engine-data:
  postgres-data:
