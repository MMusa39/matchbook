{{- if .Values.infra.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka
  labels: {{- include "matchbook.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-kafka }
  ports:
    - { name: broker, port: 9092 }
    - { name: controller, port: 9093 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-kafka
  labels: {{- include "matchbook.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-kafka
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-kafka }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-kafka }
    spec:
      containers:
        - name: kafka
          image: {{ .Values.infra.kafka.image }}
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://{{ .Release.Name }}-kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_NUM_PARTITIONS, value: "6" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx{{ .Values.infra.kafka.heap }} -Xms{{ .Values.infra.kafka.heap }}" }
          ports:
            - { containerPort: 9092 }
            - { containerPort: 9093 }
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels: {{- include "matchbook.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-redis }
  ports:
    - { port: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels: {{- include "matchbook.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-redis }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-redis }
    spec:
      containers:
        - name: redis
          image: {{ .Values.infra.redis.image }}
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
          ports:
            - { containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "matchbook.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-postgres }
  ports:
    - { port: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "matchbook.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-postgres }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.infra.postgres.image }}
          env:
            - { name: POSTGRES_DB, value: matchbook }
            - { name: POSTGRES_USER, value: matchbook }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-secrets, key: postgres-password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "matchbook", "-d", "matchbook"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: {{ .Values.infra.postgres.storage }} }
{{- end }}
