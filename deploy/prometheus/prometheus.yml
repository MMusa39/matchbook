global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: engine
    metrics_path: /metrics
    static_configs:
      - targets: ["engine:9100"]
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: marketdata
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["marketdata:8081"]
  - job_name: posttrade
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["posttrade:8082"]
