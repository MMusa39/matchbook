spring:
  application:
    name: posttrade
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:matchbook}
    username: ${POSTGRES_USER:matchbook}
    password: ${POSTGRES_PASSWORD:changeme-local}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: posttrade
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read-committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: manual-immediate
      observation-enabled: true

server:
  port: ${POSTTRADE_HTTP_PORT:8082}

management:
  otlp:
    metrics:
      export:
        enabled: false   # metrics go to Prometheus; OTLP is used for traces only
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
    export:
      enabled: ${OTEL_TRACES_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: posttrade

matchbook:
  trades-topic: matchbook.trades
  executions-topic: matchbook.executions
  positions-topic: matchbook.positions
  symbols-file: ${MATCHBOOK_SYMBOLS_FILE:}
