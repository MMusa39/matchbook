spring:
  application:
    name: marketdata
  threads:
    virtual:
      enabled: true

server:
  port: ${MARKETDATA_HTTP_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: marketdata

matchbook:
  engine-target: ${ENGINE_TARGET:localhost:9090}
  symbols-file: ${MATCHBOOK_SYMBOLS_FILE:}
