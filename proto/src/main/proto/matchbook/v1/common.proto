syntax = "proto3";

package matchbook.v1;

option java_multiple_files = true;
option java_package = "dev.matchbook.proto.v1";
option java_outer_classname = "CommonProto";

// Enum zero values are UNSPECIFIED so an unset field is never mistaken for a real value.

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

enum StpMode {
  STP_MODE_UNSPECIFIED = 0;  // the gateway applies CANCEL_RESTING
  STP_MODE_CANCEL_RESTING = 1;
  STP_MODE_CANCEL_AGGRESSOR = 2;
  STP_MODE_CANCEL_BOTH = 3;
}

enum ExecType {
  EXEC_TYPE_UNSPECIFIED = 0;
  EXEC_TYPE_NEW = 1;
  EXEC_TYPE_PARTIAL_FILL = 2;
  EXEC_TYPE_FILL = 3;
  EXEC_TYPE_CANCELED = 4;
  EXEC_TYPE_REPLACED = 5;
  EXEC_TYPE_REJECTED = 6;
  EXEC_TYPE_CANCEL_REJECTED = 7;
  EXEC_TYPE_REPLACE_REJECTED = 8;
}

enum Liquidity {
  LIQUIDITY_UNSPECIFIED = 0;
  LIQUIDITY_MAKER = 1;
  LIQUIDITY_TAKER = 2;
}
