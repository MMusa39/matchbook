name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build, unit, property and integration tests (Testcontainers)
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/*-reports/"

  benchmark-smoke:
    name: Benchmark smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B -q -DskipTests -pl engine-bench -am install
      - name: JMH (short) with allocation profiling
        run: >
          java -jar engine-bench/target/benchmarks.jar 'MatchingEngineBenchmark.mixedWorkload'
          -p pooling=true -f 1 -wi 2 -w 1s -i 3 -r 1s -prof gc -rf json -rff jmh-smoke.json
      - name: Fail if the matching path allocates
        run: |
          python3 - <<'PY'
          import json
          result = json.load(open("jmh-smoke.json"))[0]
          norm = result["secondaryMetrics"]["gc.alloc.rate.norm"]["score"]
          print(f"mixedWorkload allocation: {norm:.4f} B/op")
          assert norm < 1.0, f"matching path allocates {norm} B/op"
          PY
      - name: Open-loop latency (short)
        run: >
          java -Xms1g -Xmx1g -cp engine-bench/target/benchmarks.jar dev.matchbook.bench.OpenLoopLoadGenerator
          --rate 50000 --duration 10 --warmup 5 --wait YIELDING --outbound-wait YIELDING --label ci-smoke --out bench-out
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: |
            jmh-smoke.json
            bench-out/

  deploy-config:
    name: Helm and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/matchbook
      - run: helm template matchbook deploy/helm/matchbook > /dev/null
      - run: docker compose -f deploy/compose.yaml config --quiet
